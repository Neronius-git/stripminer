# Publishes a GitHub release with the mod jar whenever a version tag (e.g. v26.3.5.1) is pushed.
# The tag must match the version in gradle.properties.

name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: check that the tag matches the mod version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in gradle.properties"
            exit 1
          fi
      - name: build
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Release notes: this version's section of CHANGELOG.md
          awk -v head="## $version" '$0 == head {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          printf '\nFor Minecraft 26.3 with Fabric Loader and Fabric API. Put the jar in your mods folder.\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" "build/libs/stripminer-$version.jar" \
            --title "Strip Miner $version (Minecraft 26.3)" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
